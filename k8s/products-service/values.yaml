replicaCount: 1

image:
  repository: nikhilmhatre0317/picknorder-products-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

containerPort: 3001

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

env:
  NODE_ENV: production
  PORT: "3001"
  LOG_LEVEL: info

secret:
  name: products-service-secrets
  keys:
    - DATABASE_URL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  enabled: false
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
