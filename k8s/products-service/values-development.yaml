replicaCount: 1

image:
  repository: nikhilmhatre0317/picknorder-products-service
  tag: "dev"
  pullPolicy: IfNotPresent

env:
  NODE_ENV: development
  PORT: "3001"
  LOG_LEVEL: debug

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  enabled: false
