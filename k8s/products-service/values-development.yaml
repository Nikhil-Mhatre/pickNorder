replicaCount: 1

image:
  repository: nikhilmhatre0317/picknorder-products-service
  tag: "dev"
  pullPolicy: IfNotPresent

env:
  NODE_ENV: development
  PORT: "3001"
  LOG_LEVEL: debug
  KAFKA_ENABLED: "false"
  KAFKA_CLIENT_ID: products-service
  KAFKA_SSL: "true"
  KAFKA_SASL_MECHANISM: scram-sha-256
  KAFKA_IDENTITY_TOPIC: products.events

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  enabled: false
