replicaCount: 1

image:
  repository: nikhilmhatre0317/picknorder-products-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

env:
  NODE_ENV: production
  PORT: "3001"
  LOG_LEVEL: info

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  enabled: false
