# HTTPRoute defines how incoming HTTP requests are routed
# from our Gateway to the Products Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: products-route
  namespace: products-development

spec:
  # Attach this route to our central API Gateway.
  parentRefs:
    - name: picknorder-gateway
      namespace: gateway
      sectionName: http

  rules:
    # Match requests coming through the public API version.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/products
        - path:
            type: PathPrefix
            value: /api/v1/categories
        - path:
            type: PathPrefix
            value: /api/v2/products

      # Forward the request to the internal Kubernetes Service.
      backendRefs:
        - name: products-service
          port: 3001
