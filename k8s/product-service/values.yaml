replicaCount: 1

image:
  repository: nikhilmhatre0317/picknorder-products-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

containerPort: 3001

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

env:
  NODE_ENV: production
  PORT: "3001"
  LOG_LEVEL: info
  KAFKA_ENABLED: "false"
  KAFKA_CLIENT_ID: products-service
  KAFKA_SSL: "true"
  KAFKA_SASL_MECHANISM: scram-sha-256
  KAFKA_IDENTITY_TOPIC: products.events

secret:
  name: products-service-secrets
  keys:
    - DATABASE_URL
    - KAFKA_USERNAME
    - KAFKA_PASSWORD

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  enabled: false
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
