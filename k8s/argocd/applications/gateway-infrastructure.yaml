
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gateway-infrastructure
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://github.com/Nikhil-Mhatre/pickNorder.git
    targetRevision: feat
    path: k8s/gateway/base

  destination:
    server: https://kubernetes.default.svc
    namespace: gateway

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
