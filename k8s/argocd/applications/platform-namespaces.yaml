apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform

  source:
    repoURL: https://github.com/Nikhil-Mhatre/pickNorder.git
    targetRevision: main
    path: k8s/platform/namespaces

  destination:
    server: https://kubernetes.default.svc
    namespace: products-development

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
