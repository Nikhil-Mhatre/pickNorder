name: pickNorder CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: picknorder-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  picknorder-ci:
    name: pickNorder CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client For Product Service
        run: pnpm db:generate:product

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
